// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 33
        ndkVersion = "23.1.7779620"
    }
    repositories {
        // Prefer official repositories first to ensure latest AndroidX/Media3 are found
        google()
        mavenCentral()
        maven { url 'https://dl.google.com/dl/android/maven2' }
        maven { url 'https://maven.google.com' }
        maven { url 'https://jitpack.io' }
        // Mirrors last as fallback
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        jcenter()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0")
    }
}

allprojects {
    repositories {
        // Prefer official repositories first to ensure latest AndroidX/Media3 are found
        google()
        mavenCentral()
        maven { url 'https://dl.google.com/dl/android/maven2' }
        maven { url 'https://maven.google.com' }
        maven { url 'https://jitpack.io' }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        // Mirrors last as fallback
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        jcenter()
    }

    // Ensure dependencies that still reference 'react-native' artifact resolve to 'react-android'
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            // Keep this version in sync with your package.json react-native version
            def rnMavenVersion = "0.72.6"
            substitute(module("com.facebook.react:react-native"))
                .using(module("com.facebook.react:react-android:${rnMavenVersion}"))
        }
    }
}
